[package]
name = "daw-plugin-host"
description = "Runs plugins in a separate host process, with shared-memory audio and crash recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
daw-core.workspace = true
daw-plugins = { path = "../daw-plugins" }
libc = "0.2"
log.workspace = true
memmap2 = "0.9"
serde.workspace = true
serde_json.workspace = true
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
daw-test-support.workspace = true
tempfile = "3"
zbus = { version = "5", default-features = false, features = ["p2p"] }

[[bin]]
name = "daw-plugin-host"
path = "src/bin/daw-plugin-host.rs"

[lints]
workspace = true
