[package]
name = "daw-plugins-clap"
description = "CLAP plugin hosting for the DAW, built on clack-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
daw-core.workspace = true
clack-host = "0.2"
clack-extensions = { version = "0.2", features = [
    "clack-host",
    "audio-ports",
    "gui",
    "latency",
    "log",
    "note-ports",
    "params",
    "posix-fd",
    "state",
    "thread-check",
    "timer",
] }
libc = "0.2"

[dev-dependencies]
assert_no_alloc = "1.1"

[lints]
workspace = true
