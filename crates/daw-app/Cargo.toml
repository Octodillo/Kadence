[package]
name = "daw-app"
description = "Kadence's Plasma front end: a Kirigami application written with CXX-Qt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kadence"
path = "src/main.rs"

[dependencies]
daw-arrange = { path = "../daw-arrange" }
daw-core.workspace = true
daw-media = { path = "../daw-media" }
daw-model = { path = "../daw-model" }
daw-midi = { path = "../daw-midi" }
daw-pianoroll = { path = "../daw-pianoroll" }
daw-session = { path = "../daw-session" }
daw-plugins = { path = "../daw-plugins" }
daw-plugin-host = { path = "../daw-plugin-host" }
cxx = "1.0.176"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
daw-devices = { path = "../daw-devices" }
daw-engine = { path = "../daw-engine" }

[dev-dependencies]
assert_no_alloc.workspace = true
tempfile = "3"

[build-dependencies]
cxx-qt-build = "0.10"

[lints]
workspace = true
