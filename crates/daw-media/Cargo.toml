[package]
name = "daw-media"
description = "Audio file decoding, encoding, resampling, peak caches, disk streaming and recording."
version.workspace = true
edition.workspace = true
rust-version = "1.87" # rubato 5 needs 1.87
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
daw-core.workspace = true
flacenc = "0.5"
hound = "3.5"
rtrb = "0.4"
rubato = "5"
symphonia = { version = "0.6", default-features = false, features = ["aiff", "flac", "mp3", "ogg", "pcm", "vorbis", "wav", "adpcm", "opt-simd"] }
thiserror.workspace = true

[dev-dependencies]
assert_no_alloc.workspace = true
tempfile = "3"

[lints]
workspace = true
