# cargo deny check licenses: every dependency must be GPL-3.0-or-later compatible.

[graph]
all-features = true

[licenses]
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
