[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/Octodillo/daw"
publish = false

[workspace.dependencies]
daw-core = { path = "crates/daw-core" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
hound = "3.5"
assert_no_alloc = { version = "1", features = ["warn_debug"] }
loom = "0.7"
proptest = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.dev]
# Audio code is unusable unoptimised; keep debug info but optimise a little.
opt-level = 1

[profile.dev.package."*"]
# Dependencies (decoders, resamplers, DSP) are compiled once; build them fully optimised.
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
