[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/Octodillo/daw"
publish = false

[workspace.dependencies]
daw-core = { path = "crates/daw-core" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.dev]
# Audio code is unusable unoptimised; keep debug info but optimise a little.
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
