name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: system packages
        # jack-sys needs jack.pc to build; jackd2 runs the JACK integration tests.
        # lilv links daw-plugins-lv2; mda-lv2 and x42-plugins are its test
        # plugins; Xvfb lets its tests open plugin UIs. lv2-dev and
        # lv2-examples are for the vendored livi's tests.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libjack-jackd2-dev jackd2 liblilv-dev mda-lv2 x42-plugins xvfb \
            lv2-dev lv2-examples
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The vendored livi is its own workspace with its own target dir.
          workspaces: |
            . -> target
            third_party/livi -> target
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --exclude daw-app --all-targets -- -D warnings
      - name: clippy (release)
        # cfg(debug_assertions) code can leave items unused in release builds,
        # which the CMake install checks (Arch and neon jobs) build with
        # RUSTFLAGS=-D warnings; this catches it in the fast job.
        run: cargo clippy --release --workspace --exclude daw-app -- -D warnings
      - name: tests
        # -noreset: otherwise Xvfb resets when one test process disconnects
        # and drops the connection of a test opening a plugin UI in parallel.
        run: xvfb-run -a -s "-noreset" cargo nextest run --workspace --exclude daw-app --no-tests=warn
        env:
          DAW_REQUIRE_LV2_PLUGINS: 1
      - name: vendored livi tests
        # Its own workspace (see third_party/livi/KADENCE.md); its tests
        # build small C plugins and use the LV2 example plugins.
        run: cargo test --manifest-path third_party/livi/Cargo.toml
      - name: JACK integration tests
        run: |
          jackd --no-realtime -d dummy -r 48000 -p 256 &
          sleep 2
          cargo nextest run -p daw-backend --run-ignored only
          kill %1
      - name: doc tests
        run: cargo test --workspace --exclude daw-app --doc

  licenses:
    name: cargo deny (licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  # The desktop images install the system libraries later crates link
  # against (Qt 6, Kirigami, JACK via PipeWire, lilv), build and test the
  # whole workspace, and check the CMake install layout.
  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rustup cmake ninja clang \
            qt6-base qt6-declarative qt6-wayland kirigami qqc2-desktop-style \
            kcoreaddons ki18n kcrash kconfig kcolorscheme kiconthemes \
            breeze breeze-icons noto-fonts lld gettext python \
            extra-cmake-modules pipewire-jack lilv \
            desktop-file-utils appstream xorg-server-xvfb
          rustup default stable
          rustup component add rustfmt clippy
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: arch
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: >-
          cargo nextest run --workspace --no-tests=warn
          -E 'not (package(daw-app) and binary(song))'
      # In its own step, so a broken song workflow shows as its own red
      # step, and the render is kept for listening.
      # --workspace with a filter, so it reuses the build from the step
      # above. Tests run in their package directory, so the output path is
      # absolute ($GITHUB_WORKSPACE, which is the container's path here).
      - name: Song smoke test (make a song, save, reload, render)
        run: >-
          KADENCE_SMOKE_OUT="$GITHUB_WORKSPACE/smoke-song"
          cargo nextest run --workspace --no-capture
          -E 'package(daw-app) and binary(song)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-song
          path: smoke-song/
          if-no-files-found: warn
      - name: CMake install layout
        run: ci/check-install.sh
      # Built in its own step: building daw-app alone unifies features
      # differently from the workspace test build, so it recompiles most of
      # the tree, which can take longer than the screenshot timeout allows.
      - name: Build kadence (debug)
        run: cargo build -p daw-app
      - name: Screenshots (Breeze light and dark, 100% and 200%)
        timeout-minutes: 10
        run: |
          for scheme in BreezeLight BreezeDark; do
            for scale in 1 2; do
              XDG_CONFIG_HOME=$(mktemp -d) QT_QPA_PLATFORM=offscreen QT_SCALE_FACTOR=$scale \
                timeout 120 target/debug/kadence --color-scheme $scheme \
                --screenshot-dir screenshots/$scheme-$((scale * 100))
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: screenshots/

  neon:
    name: KDE neon (Ubuntu 24.04)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      # Before git is installed, so this is a plain download; nothing
      # below needs the history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install system packages, with the KDE neon archive
        # Skips the job on a neon archive outage; see the script.
        id: neon
        run: >-
          bash ci/neon-archive.sh
          build-essential git cmake ninja-build clang pkg-config
          qt6-base-dev qt6-base-dev-tools qt6-declarative-dev
          kf6-kirigami-dev qml6-module-org-kde-kirigami kf6-qqc2-desktop-style
          qml6-module-qtquick-dialogs
          kf6-kcoreaddons-dev kf6-ki18n-dev kf6-kcrash-dev kf6-kconfig-dev
          kf6-kcolorscheme-dev kf6-kiconthemes-dev kf6-breeze-icon-theme breeze
          lld fonts-noto-core
          extra-cmake-modules python3 libjack-jackd2-dev liblilv-dev
          desktop-file-utils appstream xvfb
      - name: Install Rust
        if: steps.neon.outputs.available == 'true'
        run: |
          # A pinned rustup-init, checked against its sha256, rather than curl | sh.
          curl -fsSL -o /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.29.2/x86_64-unknown-linux-gnu/rustup-init
          echo '5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4  /tmp/rustup-init' | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - if: steps.neon.outputs.available == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: neon
      - if: steps.neon.outputs.available == 'true'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - name: clippy
        if: steps.neon.outputs.available == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        if: steps.neon.outputs.available == 'true'
        run: cargo nextest run --workspace --no-tests=warn
      - name: CMake install layout
        if: steps.neon.outputs.available == 'true'
        run: ci/check-install.sh
