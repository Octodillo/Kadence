name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: system packages
        # jack-sys needs jack.pc to build; jackd2 runs the JACK integration tests.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjack-jackd2-dev jackd2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo nextest run --workspace --no-tests=warn
      - name: JACK integration tests
        run: |
          jackd --no-realtime -d dummy -r 48000 -p 256 &
          sleep 2
          cargo nextest run -p daw-backend --run-ignored only
          kill %1
      - name: doc tests
        run: cargo test --workspace --doc
