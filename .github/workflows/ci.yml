name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: system packages
        # jack-sys needs jack.pc to build; jackd2 runs the JACK integration tests.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjack-jackd2-dev jackd2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --exclude daw-app --all-targets -- -D warnings
      - name: tests
        run: cargo nextest run --workspace --exclude daw-app --no-tests=warn
      - name: JACK integration tests
        run: |
          jackd --no-realtime -d dummy -r 48000 -p 256 &
          sleep 2
          cargo nextest run -p daw-backend --run-ignored only
          kill %1
      - name: doc tests
        run: cargo test --workspace --exclude daw-app --doc

  licenses:
    name: cargo deny (licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  # The desktop images install the system libraries later crates link
  # against (Qt 6, Kirigami, JACK via PipeWire, lilv), build and test the
  # whole workspace, and check the CMake install layout.
  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rustup cmake ninja clang \
            qt6-base qt6-declarative qt6-wayland kirigami qqc2-desktop-style \
            kcoreaddons ki18n kcrash kconfig kcolorscheme kiconthemes \
            breeze breeze-icons noto-fonts lld gettext \
            extra-cmake-modules pipewire-jack lilv \
            desktop-file-utils appstream xorg-server-xvfb
          rustup default stable
          rustup component add rustfmt clippy
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: arch
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo nextest run --workspace --no-tests=warn
      - name: CMake install layout
        run: ci/check-install.sh
      - name: Screenshots (Breeze light and dark, 100% and 200%)
        timeout-minutes: 10
        run: |
          cargo build -p daw-app
          for scheme in BreezeLight BreezeDark; do
            for scale in 1 2; do
              XDG_CONFIG_HOME=$(mktemp -d) QT_QPA_PLATFORM=offscreen QT_SCALE_FACTOR=$scale \
                timeout 120 target/debug/kadence --color-scheme $scheme \
                --screenshot-dir screenshots/$scheme-$((scale * 100))
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  neon:
    name: KDE neon (Ubuntu 24.04)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install system packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://archive.neon.kde.org/public.key \
            | gpg --dearmor -o /usr/share/keyrings/neon.gpg
          echo "deb [signed-by=/usr/share/keyrings/neon.gpg] https://archive.neon.kde.org/user noble main" \
            > /etc/apt/sources.list.d/neon.list
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git cmake ninja-build clang pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            kf6-kirigami-dev qml6-module-org-kde-kirigami kf6-qqc2-desktop-style \
            qml6-module-qtquick-dialogs \
            kf6-kcoreaddons-dev kf6-ki18n-dev kf6-kcrash-dev kf6-kconfig-dev \
            kf6-kcolorscheme-dev kf6-kiconthemes-dev kf6-breeze-icon-theme breeze \
            lld fonts-noto-core \
            extra-cmake-modules libjack-jackd2-dev liblilv-dev \
            desktop-file-utils appstream xvfb
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: neon
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo nextest run --workspace --no-tests=warn
      - name: CMake install layout
        run: ci/check-install.sh
