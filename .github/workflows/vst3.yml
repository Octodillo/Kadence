name: VST3

# Builds the VST 3 SDK's `again` sample and runs the VST3 host tests against it, including the
# editor under Xvfb. Kept apart from ci.yml because the SDK build needs extra system packages.

on:
  push:
    branches: [main]
    paths: &sources
      # daw-plugins-vst3 and the workspace crates it builds on, the editor
      # window among them; then what decides how they are built.
      - crates/daw-plugins-vst3/**
      - crates/daw-core/**
      - crates/daw-plugin-window/**
      - crates/daw-test-support/**
      - .github/workflows/vst3.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  pull_request:
    paths: *sources

# A new push to a pull request cancels the run it outdates, which would only
# hold runners the newer run needs. Runs on main are grouped by commit, so
# each merge still gets its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  VST3_SDK_TAG: v3.8.1_build_84

jobs:
  again:
    name: VST3 host vs SDK again sample (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System packages for the SDK and VSTGUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build xvfb gdb \
            libx11-xcb-dev libxcb-util-dev libxcb-cursor-dev libxcb-xkb-dev libxcb-keysyms1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libcairo2-dev \
            libgtkmm-3.0-dev libsqlite3-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: sdk-cache
        with:
          path: vst3-again
          key: vst3-again-${{ runner.os }}-${{ env.VST3_SDK_TAG }}
      - name: Build again.vst3
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$VST3_SDK_TAG" --recursive --shallow-submodules \
            https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          cmake -S "$RUNNER_TEMP/vst3sdk" -B "$RUNNER_TEMP/sdk-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
            -DSMTG_RUN_VST_VALIDATOR=OFF \
            -DSMTG_CREATE_PLUGIN_LINK=OFF
          cmake --build "$RUNNER_TEMP/sdk-build" --target again
          mkdir -p vst3-again
          cp -r "$(find "$RUNNER_TEMP/sdk-build" -type d -name again.vst3 | head -1)" vst3-again/
          find vst3-again -name '*.so'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - name: Tests against again.vst3
        env:
          KADENCE_VST3_AGAIN: ${{ github.workspace }}/vst3-again/again.vst3
          KADENCE_VST3_REQUIRE_SDK_PLUGINS: "1"
        run: xvfb-run -a cargo nextest run -p daw-plugins-vst3 --no-fail-fast
      - name: Backtrace for a crashing editor test
        if: failure()
        env:
          KADENCE_VST3_AGAIN: ${{ github.workspace }}/vst3-again/again.vst3
        run: |
          # Ask cargo where the test binary is: its place under target/ has
          # changed between cargo versions.
          bin=$(cargo test -p daw-plugins-vst3 --test vst3 --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "vst3") | .executable' | tail -1)
          xvfb-run -a gdb -batch -ex run -ex 'thread apply all bt 30' --args "$bin" \
            sdk_again_editor_opens_in_a_floating_window --exact --nocapture --test-threads=1
