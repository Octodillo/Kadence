# Builds Kadence the way users get it on each Plasma distribution, installs
# the result, and runs the smoke test from the installed files on X11,
# Wayland and several scale factors (ci/smoke-matrix.sh).
#
# - Arch: the PKGBUILD, through makepkg (latest Qt and KDE Frameworks).
# - Fedora: the RPM spec, built offline from the vendored source tarball.
# - KDE neon: CMake install from source (latest Plasma on Ubuntu LTS).
# - Debian 13: CMake install from source, the oldest Qt (6.8) and KDE
#   Frameworks (6.13) we support.
# - Flatpak: the KDE runtime manifest, built and run in its sandbox.
#
# The package jobs run the scripts the Release workflow runs (ci/*-package.sh).
# The weekly run also checks the dependencies against the RustSec advisories.
name: Packaging

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - packaging/**
      - data/**
      - ci/**
      - CMakeLists.txt
      - Cargo.lock
      - crates/**
      - Cargo.toml
      - rust-toolchain.toml
      - .github/workflows/packaging.yml
  schedule:
    # Weekly, to catch distro updates that break the build.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels the run it outdates, which would only
# hold runners the newer run needs. Every other run (main, schedule, manual)
# is a group of its own, so none is cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git namcap sudo \
            weston xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: makepkg, namcap, install, smoke test
        run: ci/arch-package.sh git out
      - name: The release PKGBUILD is written and lints
        # The release workflow builds it; here, only that the generator
        # still understands the PKGBUILD it reads.
        run: |
          mkdir /tmp/release-pkgbuild
          packaging/arch/release-pkgbuild.sh 0.0.0 > /tmp/release-pkgbuild/PKGBUILD
          bash -n /tmp/release-pkgbuild/PKGBUILD
          ci/arch-package.sh lint /tmp/release-pkgbuild/PKGBUILD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-package
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  fedora:
    name: Fedora package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: |
          dnf -y install git cargo rpm-build rpmlint dnf-plugins-core \
            weston xorg-x11-server-Xvfb xorg-x11-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Source tarball (vendored crates)
        run: |
          git config --system --add safe.directory '*'
          packaging/make-dist.sh dist
      - name: rpmbuild, rpmlint, install, smoke test
        run: ci/fedora-package.sh dist/kadence-*.tar.gz out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora-package
          path: out/*.x86_64.rpm
          if-no-files-found: error

  neon:
    name: KDE neon install
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      # Before git is installed, so this is a plain download; nothing
      # below needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages, with the KDE neon archive
        # Skips the job on a neon archive outage; see the script.
        id: neon
        run: >-
          bash ci/neon-archive.sh
          build-essential git cmake ninja-build clang lld pkg-config
          qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-wayland
          kf6-kirigami-dev qml6-module-org-kde-kirigami kf6-qqc2-desktop-style
          qml6-module-qtquick-dialogs
          kf6-kcoreaddons-dev kf6-ki18n-dev kf6-kcrash-dev kf6-kconfig-dev
          kf6-kcolorscheme-dev kf6-kiconthemes-dev kf6-breeze-icon-theme
          extra-cmake-modules gettext python3 libjack-jackd2-dev liblilv-dev
          weston xvfb xauth
      - name: Install Rust
        if: steps.neon.outputs.available == 'true'
        run: ci/install-rustup.sh
      - if: steps.neon.outputs.available == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The crates the CMake build compiles, in its target directory;
          # only Kadence's own are built afresh. Saved from main only, so
          # pull requests do not fill the cache with copies of it.
          workspaces: . -> build/cargo
          key: neon-install
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and install to /usr
        if: steps.neon.outputs.available == 'true'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          cmake --install build
      - name: Smoke test (installed)
        if: steps.neon.outputs.available == 'true'
        run: |
          useradd -m tester
          su tester -c "REQUIRE_ALL=1 ci/smoke-matrix.sh /usr/bin/kadence"

  debian:
    name: Debian 13 install (oldest Qt and KF6)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install system packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential git cmake ninja-build clang lld pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-wayland \
            libkirigami-dev qml6-module-org-kde-kirigami qml6-module-org-kde-desktop \
            qml6-module-qtquick-dialogs \
            libkf6coreaddons-dev libkf6i18n-dev libkf6crash-dev libkf6config-dev \
            libkf6colorscheme-dev libkf6iconthemes-dev breeze-icon-theme \
            extra-cmake-modules gettext python3 libjack-jackd2-dev liblilv-dev \
            weston xvfb xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        # Debian's is older than the workspace's rust-version.
        run: ci/install-rustup.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # As in the neon job.
          workspaces: . -> build/cargo
          key: debian-install
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and install to /usr
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          cmake --install build
      - name: Smoke test (installed)
        run: |
          useradd -m tester
          su tester -c "REQUIRE_ALL=1 ci/smoke-matrix.sh /usr/bin/kadence"

  flatpak:
    name: Flatpak (KDE runtime)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      # flatpak-builder sandboxes each build step with bubblewrap.
      options: --privileged
    steps:
      # Before git is installed, so this is a plain download; nothing
      # below needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flatpak and the runtimes
        run: ci/flatpak-package.sh setup org.flatpak.Builder
      # The module sources and vendored crates flatpak-builder downloads.
      # Saved from main only; a download that times out (lv2plug.in has)
      # then fails no pull request whose sources main already fetched.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: downloads
        with:
          path: /tmp/flatpak-state/downloads
          key: flatpak-downloads-${{ hashFiles('packaging/flatpak/*.yml', 'Cargo.lock') }}
          restore-keys: flatpak-downloads-
      - name: Build, install and smoke test in the sandbox
        run: ci/flatpak-package.sh build kadence.flatpak
      - name: Keep only the downloads this build uses
        # flatpak-builder files each download under its sha256 and never
        # removes one; without this the cache would keep every superseded
        # crate and archive restored from older keys.
        if: github.ref == 'refs/heads/main' && steps.downloads.outputs.cache-hit != 'true'
        run: |
          used=$(grep -ohE '[0-9a-f]{64}' packaging/flatpak/*.yml packaging/flatpak/cargo-sources.json | sort -u)
          for dir in /tmp/flatpak-state/downloads/*/; do
            echo "$used" | grep -qx "$(basename "$dir")" || rm -rf "$dir"
          done
      - if: github.ref == 'refs/heads/main' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/flatpak-state/downloads
          key: flatpak-downloads-${{ hashFiles('packaging/flatpak/*.yml', 'Cargo.lock') }}
      - name: Lint
        # Advisory: the linter enforces Flathub's submission rules, and some
        # (the generated cargo-sources.json not being committed, x11 together
        # with wayland, home directory access) do not apply to a bundle
        # attached to a GitHub release.
        continue-on-error: true
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest packaging/flatpak/io.github.octodillo.daw.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo /tmp/repo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-bundle
          path: kadence.flatpak

  # Only on the weekly run (and by hand), so a new advisory against a
  # dependency does not turn unrelated pull requests red. The Release
  # workflow runs the same check before it builds anything.
  advisories:
    name: cargo deny (advisories)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
