#
# Flatpak build of Kadence on the KDE runtime. Cargo builds offline from
# cargo-sources.json, which packaging/flatpak/cargo-sources.py makes from
# Cargo.lock (CI regenerates it on every run; a Flathub submission commits it).
#
#   packaging/flatpak/cargo-sources.py
#   flatpak-builder --user --install --force-clean build-flatpak \
#       packaging/flatpak/io.github.octodillo.daw.yml
id: io.github.octodillo.daw
runtime: org.kde.Platform
# KDE 6.11 is built on freedesktop 25.08. The SDK extensions and the plugin
# extension below must use that same branch, so bump all of them together.
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm21
command: kadence

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio and MIDI go through PipeWire's JACK interface. The PulseAudio
  # socket covers systems where PipeWire's socket isn't exposed.
  - --filesystem=xdg-run/pipewire-0
  - --socket=pulseaudio
  # Projects and samples usually live here; anything else goes through the
  # file chooser portal.
  - --filesystem=xdg-music
  # Plugins installed in the user's home, read only.
  - --filesystem=~/.clap:ro
  - --filesystem=~/.lv2:ro
  - --filesystem=~/.vst3:ro
  # The CLAP and VST3 hosts search these before the standard locations.
  # LV2_PATH would replace lilv's defaults instead, so it is left unset: the
  # LV2 host adds /app/extensions/Plugins/lv2 itself inside Flatpak.
  - --env=CLAP_PATH=/app/extensions/Plugins/clap
  - --env=VST3_PATH=/app/extensions/Plugins/vst3

# Plugins packaged for Flatpak (org.freedesktop.LinuxAudio.Plugins.*), the
# same extension point Ardour, Zrythm and Bitwig use.
add-extensions:
  org.freedesktop.LinuxAudio.Plugins:
    directory: extensions/Plugins
    version: '25.08'
    add-ld-path: lib
    merge-dirs: clap;lv2;vst3;ladspa;dssi;lxvst
    subdirectories: true
    no-autodownload: true

cleanup:
  - /include
  - /lib/pkgconfig

modules:
  # lilv and what it needs, for LV2 plugin hosting; the KDE runtime has none
  # of them.
  - name: lv2
    buildsystem: meson
    config-opts: [-Ddocs=disabled, -Dplugins=disabled, -Dtests=disabled]
    sources:
      - type: archive
        url: https://lv2plug.in/spec/lv2-1.18.10.tar.xz
        sha256: 78c51bcf21b54e58bb6329accbb4dae03b2ed79b520f9a01e734bd9de530953f
  - name: zix
    buildsystem: meson
    config-opts: [-Ddocs=disabled, -Dtests=disabled, -Dbenchmarks=disabled]
    sources:
      - type: archive
        url: https://download.drobilla.net/zix-0.6.2.tar.xz
        sha256: 4bc771abf4fcf399ea969a1da6b375f0117784f8fd0e2db356a859f635f616a7
  - name: serd
    buildsystem: meson
    config-opts: [-Ddocs=disabled, -Dtests=disabled, -Dtools=disabled, -Dman=disabled]
    sources:
      - type: archive
        url: https://download.drobilla.net/serd-0.32.4.tar.xz
        sha256: cbefb569e8db686be8c69cb3866a9538c7cb055e8f24217dd6a4471effa7d349
  - name: sord
    buildsystem: meson
    config-opts: [-Ddocs=disabled, -Dtests=disabled, -Dtools=disabled, -Dman=disabled]
    sources:
      - type: archive
        url: https://download.drobilla.net/sord-0.16.18.tar.xz
        sha256: 4f398b635894491a4774b1498959805a08e11734c324f13d572dea695b13d3b3
  - name: sratom
    buildsystem: meson
    config-opts: [-Ddocs=disabled, -Dtests=disabled]
    sources:
      - type: archive
        url: https://download.drobilla.net/sratom-0.6.18.tar.xz
        sha256: 4c6a6d9e0b4d6c01cc06a8849910feceb92e666cb38779c614dd2404a9931e92
  - name: lilv
    buildsystem: meson
    config-opts: [-Ddocs=disabled, -Dtests=disabled, -Dtools=disabled, -Dbindings_py=disabled]
    sources:
      - type: archive
        url: https://download.drobilla.net/lilv-0.24.26.tar.xz
        sha256: 22feed30bc0f952384a25c2f6f4b04e6d43836408798ed65a8a934c055d5d8ac

  - name: kadence
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DKADENCE_LICENSE_DIR=share/licenses/io.github.octodillo.daw
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
      env:
        CARGO_HOME: /run/build/kadence/cargo
        CARGO_NET_OFFLINE: 'true'
    post-install:
      - install -d /app/extensions/Plugins
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build
          - build-ci
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
