# Vendored copy of livi 0.9.0 (https://github.com/wmedrano/livi-rs, commit
# 887c7afb60a5fcf82fcba0fbcb249401820746cb), MIT licensed. Kadence's changes
# are listed in KADENCE.md. The upstream examples and jack-based integration
# tests are left out, with their dev-dependencies.
[package]
authors = ["Will S. Medrano <will.s.medrano@gmail.com>"]
description = "livi is a library for hosting LV2 plugins."
documentation = "https://docs.rs/livi"
edition = "2024"
keywords = ["realtime", "audio", "lv2", "plugins", "music"]
license = "MIT"
name = "livi"
readme = "README.md"
repository = "https://github.com/wmedrano/livi-rs"
version = "0.9.0"
publish = false

[dependencies]
lilv = "0.3.1"
log = "0.4"
lv2-sys = "2"
lv2_raw = "0.3"
ringbuf = "0.5.3"

[dev-dependencies]
lazy_static = "1.5"
tempfile = "3.27"

# Not part of the Kadence workspace, so its tests run on their own (CI does).
[workspace]
